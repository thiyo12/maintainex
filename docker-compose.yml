version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maintainex-postgres
    restart: unless-stopped
    # Local development only: never publish PostgreSQL on all host interfaces.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: maintainex
      POSTGRES_USER: maintainex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maintainex -d maintainex']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
