name: Temporary Web Dependency Resolver

on:
  push:
    branches:
      - feature/mobile-v2-rebuild

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve production audit fixes in lockfile
        run: npm audit fix --package-lock-only --omit=dev
      - name: Prove production audit is clean
        run: npm audit --omit=dev --audit-level=high
      - name: Prove patched transitive versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const sharp = lock.packages?.['node_modules/sharp']?.version
          const sourceMap = lock.packages?.['node_modules/source-map-js']?.version
          console.log({ sharp, sourceMap })
          if (sharp !== '0.35.5') throw new Error('sharp must resolve to 0.35.5')
          if (sourceMap !== '1.2.2') throw new Error('source-map-js must resolve to 1.2.2')
          NODE
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-web-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
