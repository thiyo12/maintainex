name: Mobile iOS Phase 2 QA Build

on:
  push:
    branches: [feature/payment-restructuring]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-simulator-build:
    name: Expo 56 iOS simulator build (no deployment)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: 'true'
      MAINTAINEX_IOS_TEST_BUILD: '1'
      EXPO_PUBLIC_API_URL: 'http://127.0.0.1:3000'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Verify Xcode 26 and locked Expo 56 versions
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 26\.'
          node <<'NODE'
          const lock = require('./package-lock.json')
          const expected = { expo: '56.0.23', reactNative: '0.85.3' }
          const actual = {
            expo: lock.packages['node_modules/expo']?.version,
            reactNative: lock.packages['node_modules/react-native']?.version,
          }
          if (actual.expo !== expected.expo || actual.reactNative !== expected.reactNative) {
            throw new Error(`Unexpected locked Expo/RN versions: ${JSON.stringify(actual)}`)
          }
          console.log(`Locked Expo ${actual.expo}; React Native ${actual.reactNative}`)
          NODE

      - name: Install locked Expo 56 dependencies
        run: npm ci

      - name: Verify QA config fails closed and targets only local API
        run: |
          set -euo pipefail
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node <<'NODE'
          const config = require(process.env.RUNNER_TEMP + '/expo-config.json')
          if (config.extra?.apiUrl !== 'http://127.0.0.1:3000') throw new Error('QA bundle has the wrong API URL')
          if (config.ios?.bundleIdentifier !== 'lk.maintainex.app.qa') throw new Error('QA bundle identifier is not isolated')
          console.log('QA Expo config is local-only with a separate simulator bundle identifier')
          NODE

      - name: Generate clean Expo 56 iOS native project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install iOS pods
        run: pod install
        working-directory: apps/mobile/ios

      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/MaintainEXQA.xcworkspace \
            -scheme MaintainEXQA \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/maintainex-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package app with exact SHA manifest
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/maintainex-derived-data/Build/Products/Debug-iphonesimulator/MaintainEXQA.app"
          test -d "$APP_PATH"
          ARTIFACT_DIR="$RUNNER_TEMP/maintainex-ios-artifact"
          mkdir -p "$ARTIFACT_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARTIFACT_DIR/MaintainEX-QA.app.zip"
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'expo=%s\n' "$(node -p "require('./node_modules/expo/package.json').version")"
            printf 'react-native=%s\n' "$(node -p "require('./node_modules/react-native/package.json').version")"
            printf 'api-url=%s\n' "$EXPO_PUBLIC_API_URL"
            printf 'bundle-id=lk.maintainex.app.qa\n'
            printf 'deployment=disabled\n'
          } > "$ARTIFACT_DIR/build-info.txt"
          shasum -a 256 "$ARTIFACT_DIR/MaintainEX-QA.app.zip" > "$ARTIFACT_DIR/SHA256SUMS"

      - name: Upload exact-SHA iOS simulator artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: maintainex-ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/maintainex-ios-artifact
          if-no-files-found: error
          retention-days: 5
