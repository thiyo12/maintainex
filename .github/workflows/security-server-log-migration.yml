name: Security Server Log Migration

on:
  push:
    branches:
      - security/production-hardening
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migrate raw server log sinks
        run: node scripts/migrate-server-log-sinks.mjs

      - name: Verify migration scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -vE '^(app/api/|lib/(auth|crm|security|payment|finance)/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected migration files:"
            echo "$unexpected"
            exit 1
          fi

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Verify server logging security contracts
        run: >-
          npx vitest run
          tests/security/server-log-sink-inventory.test.ts
          tests/security/redaction.test.ts
          tests/security/secret-boundary-contract.test.ts
          --reporter=verbose

      - name: Commit validated server logging migration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Server log sinks already migrated"
            exit 0
          fi

          git add app/api lib/auth lib/crm lib/security lib/payment lib/finance
          git config user.name "MaintainEX Security CI"
          git config user.email "security-ci@maintainex.invalid"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git commit -m "security(logging): migrate remaining server log sinks"
          git push origin HEAD:security/production-hardening
