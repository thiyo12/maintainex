name: Security Mobile Dependency Review

on:
  push:
    branches:
      - security/production-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Resolve non-breaking mobile audit fixes
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npm pkg delete dependencies.@expo/ngrok
          npm pkg set devDependencies.@expo/ngrok=^4.1.3
          npm pkg set overrides.image-size=2.0.4
          npm audit fix --package-lock-only --omit=dev || true

      - name: Verify controlled mobile production audit
        run: node scripts/mobile-production-audit.mjs

      - name: Install resolved mobile graph
        run: npm ci --prefix apps/mobile

      - name: Mobile TypeScript
        run: npm exec --prefix apps/mobile tsc -- --noEmit

      - name: Mobile Expo export
        working-directory: apps/mobile
        run: npx expo export --platform all --output-dir /tmp/maintainex-mobile-export

      - name: Commit validated mobile dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(apps/mobile/package.json|apps/mobile/package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated files:"
            echo "$unexpected"
            exit 1
          fi
          git add apps/mobile/package.json apps/mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Mobile dependency files already resolved"
            exit 0
          fi
          git config user.name "MaintainEX Security CI"
          git config user.email "security-ci@maintainex.invalid"
          git commit -m "security(mobile-deps): resolve fixable production advisories"
          git push origin HEAD:security/production-hardening
