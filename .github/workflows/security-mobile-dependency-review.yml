name: Security Mobile Dependency Review

on:
  push:
    branches:
      - security/production-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Resolve non-breaking mobile audit fixes
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npm pkg delete dependencies.@expo/ngrok
          npm pkg set devDependencies.@expo/ngrok=^4.1.3
          npm audit fix --package-lock-only --omit=dev || true

      - name: Capture remaining production audit
        shell: bash
        working-directory: apps/mobile
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > mobile-audit.json
          npm audit --omit=dev --audit-level=high > mobile-audit.txt 2>&1
          true

      - name: Upload mobile dependency review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-mobile-dependency-review
          path: |
            apps/mobile/package.json
            apps/mobile/package-lock.json
            apps/mobile/mobile-audit.json
            apps/mobile/mobile-audit.txt
          if-no-files-found: error
          retention-days: 1
