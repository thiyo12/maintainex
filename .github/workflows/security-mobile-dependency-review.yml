name: Security Mobile Dependency Review

on:
  push:
    branches:
      - security/production-hardening
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Resolve non-breaking mobile audit fixes
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npm pkg delete dependencies.@expo/ngrok
          npm pkg set devDependencies.@expo/ngrok=^4.1.3
          npm pkg set devDependencies.vitest=^4.1.8
          npm pkg set overrides.image-size=2.0.4
          npm audit fix --package-lock-only --omit=dev || true

      - name: Verify controlled mobile production audit
        run: node scripts/mobile-production-audit.mjs

      - name: Install resolved mobile graph
        run: npm ci --prefix apps/mobile

      - name: Mobile TypeScript
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Mobile Expo export
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir /tmp/maintainex-mobile-export-android
          npx expo export --platform ios --output-dir /tmp/maintainex-mobile-export-ios

      - name: Commit validated mobile dependency resolution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(apps/mobile/package.json|apps/mobile/package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated files:"
            echo "$unexpected"
            exit 1
          fi
          git add apps/mobile/package.json apps/mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Mobile dependency files already resolved"
            exit 0
          fi
          git config user.name "MaintainEX Security CI"
          git config user.email "security-ci@maintainex.invalid"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git commit -m "security(mobile-deps): resolve fixable production advisories"
          git push origin HEAD:security/production-hardening
