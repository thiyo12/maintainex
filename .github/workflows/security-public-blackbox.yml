name: Security Public Black-Box Evidence

on:
  push:
    branches:
      - security/production-hardening
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIMARY_ORIGIN: https://maintainex.lk
      ADMIN_ORIGIN: https://admin.maintainex.lk
      SECURITY_UA: Mozilla/5.0 MaintainEX-Security-Evidence/1.0
    steps:
      - name: Verify public production security boundary
        shell: bash
        run: |
          set -u

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          failures=0
          blocked=0
          passes=0

          pass() {
            echo "PASS: $1"
            passes=$((passes + 1))
          }

          fail() {
            echo "::error::$1"
            failures=$((failures + 1))
          }

          block() {
            echo "::warning::$1"
            blocked=$((blocked + 1))
          }

          request() {
            headers="$1"
            body="$2"
            url="$3"
            shift 3
            curl --silent --show-error               --connect-timeout 10 --max-time 20               -A "$SECURITY_UA"               -D "$headers" -o "$body" -w '%{http_code}'               "$@" "$url" || printf '000'
          }

          is_cloudflare() {
            headers="$1"
            grep -qi '^cf-ray:' "$headers" || grep -qi '^server: cloudflare' "$headers"
          }

          echo "== HTTPS and release identity =="
          health_status="$(request "$tmp/health.headers" "$tmp/health.json" "$PRIMARY_ORIGIN/api/health")"
          if [ "$health_status" = "200" ]; then
            if node - "$tmp/health.json" <<'NODE'
          const fs = require('fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body.status !== 'healthy') process.exit(2)
          if (!/^[0-9a-f]{40}$/.test(String(body.release || ''))) process.exit(3)
          if (body.testOtpMode !== 'disabled') process.exit(4)
          console.log('release=' + body.release)
          NODE
            then
              pass "Production health/release identity and test OTP state"
            else
              fail "Production health JSON did not prove healthy + 40-char release SHA + test OTP disabled"
            fi
          elif [ "$health_status" = "403" ] && is_cloudflare "$tmp/health.headers"; then
            block "Cloudflare blocked /api/health from the external runner; release identity remains externally unproven from this vantage point"
          else
            fail "Unexpected /api/health status: $health_status"
          fi

          echo "== HTTPS security headers =="
          home_status="$(request "$tmp/home.headers" "$tmp/home.body" "$PRIMARY_ORIGIN/")"
          case "$home_status" in
            2??|3??) pass "Public homepage reachable over HTTPS" ;;
            403)
              if is_cloudflare "$tmp/home.headers"; then
                block "Cloudflare blocked public homepage from the external runner"
              else
                fail "Public homepage returned non-Cloudflare 403"
              fi
              ;;
            *) fail "Public homepage HTTPS status was $home_status" ;;
          esac
          for header in             strict-transport-security             x-content-type-options             content-security-policy             referrer-policy             permissions-policy
          do
            if grep -qi "^$header:" "$tmp/home.headers"; then
              pass "Public security header $header"
            elif [ "$home_status" = "403" ] && is_cloudflare "$tmp/home.headers"; then
              block "Public security header $header cannot be proven on the application response because Cloudflare returned the denial page"
            else
              fail "Missing public security header: $header"
            fi
          done
          if is_cloudflare "$tmp/home.headers"; then
            pass "Public host visibly traverses Cloudflare"
          else
            fail "Public host is not visibly traversing Cloudflare"
          fi

          echo "== HTTP to HTTPS redirect =="
          curl --silent --show-error --connect-timeout 10 --max-time 20             -A "$SECURITY_UA" -D "$tmp/http.headers" -o /dev/null "http://maintainex.lk/" || true
          http_status="$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' "$tmp/http.headers")"
          case "$http_status" in
            301|302|307|308)
              if grep -qi '^location: https://maintainex\.lk' "$tmp/http.headers"; then
                pass "HTTP redirects to HTTPS"
              else
                fail "HTTP redirect did not target maintainex.lk HTTPS"
              fi
              ;;
            *) fail "HTTP origin did not redirect to HTTPS (status=${http_status:-none})" ;;
          esac

          echo "== Protected internal readiness =="
          readiness_status="$(request "$tmp/readiness.headers" "$tmp/readiness.body" "$PRIMARY_ORIGIN/api/internal/readiness")"
          if [ "$readiness_status" = "403" ] && grep -Eq '"error"[[:space:]]*:[[:space:]]*"Forbidden"' "$tmp/readiness.body"; then
            pass "Application readiness endpoint denies unauthenticated access"
          elif [ "$readiness_status" = "403" ] && is_cloudflare "$tmp/readiness.headers"; then
            block "Cloudflare blocked readiness before the application auth boundary could be proven"
          else
            fail "Readiness endpoint did not return the expected application 403 boundary (status=$readiness_status)"
          fi

          echo "== CORS hostile-origin reflection =="
          cors_status="$(request "$tmp/cors.headers" "$tmp/cors.body" "$PRIMARY_ORIGIN/api/mobile/auth/me" -H 'Origin: https://evil.example')"
          acao="$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {gsub(/\r/,"",$2); print $2}' "$tmp/cors.headers" | tail -1)"
          if [ "$acao" = "*" ] || [ "$acao" = "https://evil.example" ]; then
            fail "Hostile/wildcard CORS origin accepted on protected mobile API"
          else
            pass "Hostile CORS origin not reflected on protected mobile API (status=$cors_status)"
          fi

          echo "== Unsafe HTTP method rejection =="
          trace_status="$(request "$tmp/trace.headers" "$tmp/trace.body" "$PRIMARY_ORIGIN/" -X TRACE)"
          if [ "$trace_status" = "200" ]; then
            fail "TRACE unexpectedly returned HTTP 200"
          else
            pass "TRACE rejected (status=$trace_status)"
          fi

          echo "== Common accidental secret/file exposure =="
          for path in '/.env' '/.git/config' '/backup.sql' '/docker-compose.yml' '/server.env'; do
            code="$(request "$tmp/file.headers" "$tmp/file.body" "$PRIMARY_ORIGIN$path")"
            if [ "$code" = "200" ]; then
              fail "Sensitive path unexpectedly returned HTTP 200: $path"
            else
              pass "Sensitive path not exposed: $path ($code)"
            fi
          done

          echo "== Admin host HTTPS boundary =="
          admin_status="$(request "$tmp/admin.headers" "$tmp/admin.body" "$ADMIN_ORIGIN/admin/login")"
          case "$admin_status" in
            2??|3??) pass "Admin login host reachable over HTTPS" ;;
            403)
              if is_cloudflare "$tmp/admin.headers"; then
                block "Cloudflare blocked admin login from the external runner"
              else
                fail "Admin login host returned non-Cloudflare 403"
              fi
              ;;
            *) fail "Admin login host unavailable or unsafe status: $admin_status" ;;
          esac
          if grep -qi '^strict-transport-security:' "$tmp/admin.headers"; then
            pass "Admin host HSTS"
          elif [ "$admin_status" = "403" ] && is_cloudflare "$tmp/admin.headers"; then
            block "Admin HSTS cannot be proven on the application response because Cloudflare returned the denial page"
          else
            fail "Admin host missing HSTS"
          fi
          if is_cloudflare "$tmp/admin.headers"; then
            pass "Admin host visibly traverses Cloudflare"
          else
            fail "Admin host is not visibly traversing Cloudflare"
          fi

          echo "== TLS validity =="
          for host in maintainex.lk admin.maintainex.lk; do
            if echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null               | openssl x509 -noout -checkend 2592000 >/dev/null
            then
              pass "TLS certificate valid for >30 days: $host"
            else
              fail "TLS certificate expires within 30 days or is invalid: $host"
            fi
          done

          {
            echo "## MaintainEX public black-box evidence"
            echo
            echo "- Pass checks: $passes"
            echo "- Blocked checks: $blocked"
            echo "- Failed checks: $failures"
            echo "- Health status observed: $health_status"
            echo "- Readiness status observed: $readiness_status"
            echo "- Admin login status observed: $admin_status"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failures" -ne 0 ]; then
            echo "::error::Public black-box evidence has $failures insecure/failed checks"
            exit 1
          fi

          if [ "$blocked" -ne 0 ]; then
            echo "::warning::Public black-box evidence completed with $blocked checks blocked by the Cloudflare vantage point; those checks remain conditional"
          fi
