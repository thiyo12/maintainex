name: International Fast Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'apps/mobile/**'
      - 'lib/**'
      - 'tests/**'
      - 'prisma/**'
      - '.github/workflows/international-fast-gates.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-typecheck:
    name: mobile-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile
      - name: Mobile TypeScript
        run: |
          set -o pipefail
          cd apps/mobile
          npx tsc --noEmit 2>&1 | tee /tmp/mobile-tsc.txt
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-tsc-diagnostics
          path: /tmp/mobile-tsc.txt
          if-no-files-found: ignore
          retention-days: 3

  work-start-guard:
    name: work-start-guard
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Fast authorization regressions
        run: npx vitest run tests/auth/work-start-auth.test.ts tests/security/phase07-company-work-start-authorization.test.ts --reporter=verbose
