name: Security Exposure Audit

on:
  push:
    branches:
      - main
      - feature/crm-job360
      - feature/crm-v2-rebuild
      - feature/crm-reference-ui-parity
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan current tree and history without printing values
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess, json
          from collections import Counter

          patterns = [
              ("private-key-material", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("github-token", re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b")),
              ("aws-access-key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("google-api-key", re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b")),
              ("stripe-live-key", re.compile(r"\b(?:sk|rk)_live_[0-9A-Za-z]{16,}\b")),
              ("slack-token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,}\b")),
              ("personal-local-path", re.compile(r"/Users/[A-Za-z0-9._-]+")),
              ("ssh-key-filename", re.compile(r"\bid_(?:rsa|ed25519|ecdsa)[A-Za-z0-9._-]+\b")),
          ]
          literal_secret = re.compile(
              r"""(?ix)
              \b(?:password|passwd|secret|token|api[_-]?key|merchant[_-]?secret|private[_-]?key)
              \s*[:=]\s*
              ["'`]
              (?!\$\{|process\.env|<|your[-_ ]|change[-_ ]|generate[-_ ]|example|test\b|ci[-_ ]only|maintainex_dev_)
              [^"'`\r\n]{20,}
              ["'`]
              """
          )
          markdown_secret = re.compile(
              r"""(?ix)
              \|\s*(?:db[-_ ]?password|password|passwd|secret|token|api[_-]?key|merchant[_-]?secret|private[_-]?key)
              \s*\|\s*
              `
              (?!<|example|test\b|maintainex_dev_)
              (?![A-Z][A-Z0-9_]{7,}`)
              [A-Za-z0-9+_.:-]{20,}
              `
              """
          )
          unquoted_random_secret = re.compile(
              r"""(?ix)
              \b(?:password|passwd|secret|token|api[_-]?key|merchant[_-]?secret|private[_-]?key)
              \s*[:=]\s*
              (?!\$\{|process\.env|<|your[-_ ]|change[-_ ]|generate[-_ ]|example|test\b|ci[-_ ]only|maintainex_dev_)
              [A-F0-9]{32,}
              \b
              """
          )
          sensitive_env_assignment = re.compile(
              r"""(?ix)
              \b(
                JWT_SECRET|JWT_REFRESH_SECRET|MARKETPLACE_JWT_SECRET|STAFF_JWT_SECRET|
                NEXTAUTH_SECRET|PASSWORD_PEPPER|IDENTITY_CLAIM_PEPPER|
                INTERNAL_SYNC_SECRET|CRON_SECRET|PAYPAL_CLIENT_SECRET|
                PAYHERE_MERCHANT_SECRET|PAYHERE_APP_SECRET|CLOUDINARY_API_SECRET|
                SMTP_APP_PASSWORD|DATABASE_URL
              )\b
              \s*[:=]\s*
              ["'`]?
              ([^"'`\s#]+)
              """
          )

          SAFE_SECRET_MARKERS = (
              "${",
              "process.env",
              "<",
              "your-",
              "your_",
              "generate-",
              "generate_",
              "example",
              "test",
              "phase07-ci-",
              "phase-",
              "ci-only",
              "maintainex_dev_",
              "sandbox-",
              "original_",
              "original.",
              "postgresql://...",
              "postgresql://user:password@host",
              "postgresql://user:pass@host",
              "new_pass",
              "new_db_host",
              "maintainex_ci@",
          )

          def classify(line):
              hits = [name for name, rx in patterns if rx.search(line)]
              literal_match = literal_secret.search(line)
              markdown_match = markdown_secret.search(line)
              random_match = unquoted_random_secret.search(line)
              env_match = sensitive_env_assignment.search(line)
              if env_match:
                  env_name = env_match.group(1).upper()
                  candidate = env_match.group(2)
                  lowered = candidate.lower()
                  safe = any(marker.lower() in lowered for marker in SAFE_SECRET_MARKERS)
                  if not safe:
                      if env_name == "DATABASE_URL" and re.search(r"://[^/:\s]+:[^@/\s]+@", candidate):
                          hits.append("database-credential")
                      elif len(candidate) >= 16:
                          hits.append("sensitive-env-assignment")
              if literal_match:
                  candidate = literal_match.group(0)
                  generated = any(marker in candidate for marker in (
                      "${",
                      "process.env",
                      "randomBytes(",
                      "Date.now(",
                  ))
                  if not generated:
                      hits.append("possible-hardcoded-secret")
              if markdown_match or random_match:
                  hits.append("possible-hardcoded-secret")
              for m in re.finditer(r"\b(?:\d{1,3}\.){3}\d{1,3}\b", line):
                  ip=m.group(0)
                  parts=[int(x) for x in ip.split(".")]
                  if all(0 <= x <= 255 for x in parts):
                      private = (
                          parts[0] in (0,10,127) or
                          (parts[0]==192 and parts[1]==168) or
                          (parts[0]==172 and 16 <= parts[1] <= 31)
                      )
                      if not private:
                          hits.append("public-ip")
                          break
              for m in re.finditer(r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}", line, re.I):
                  e=m.group(0).lower()
                  if not (e.endswith("@example.com") or e.endswith("@maintainex.com")):
                      hits.append("non-example-email")
                      break
              return sorted(set(hits))

          current=[]
          tracked=subprocess.check_output(["git","ls-files","-z"]).split(b"\0")
          for raw in tracked:
              if not raw: continue
              path=raw.decode("utf-8","replace")
              try:
                  data=open(path,"rb").read()
              except OSError:
                  continue
              if b"\0" in data[:8192]:
                  continue
              text=data.decode("utf-8","ignore")
              for n,line in enumerate(text.splitlines(),1):
                  hits=classify(line)
                  for h in hits:
                      current.append({"category":h,"path":path,"line":n})

          proc=subprocess.Popen(
              ["git","log","--all","-p","--no-color","--format=commit:%H"],
              stdout=subprocess.PIPE, text=True, errors="ignore"
          )
          hist=Counter()
          first={}
          commit=""
          path=""
          for line in proc.stdout:
              if line.startswith("commit:"):
                  commit=line.strip().split(":",1)[1]
              elif line.startswith("+++ b/"):
                  path=line[6:].strip()
              elif line.startswith("+") and not line.startswith("+++"):
                  for h in classify(line[1:]):
                      hist[h]+=1
                      first.setdefault(h,{"commit":commit,"path":path})
          proc.wait()

          print("CURRENT_FINDINGS_JSON="+json.dumps(current, separators=(",",":")))
          print("HISTORY_COUNTS_JSON="+json.dumps(dict(hist), separators=(",",":")))
          print("HISTORY_FIRST_LOCATION_JSON="+json.dumps(first, separators=(",",":")))

          blocking = {
              "private-key-material",
              "github-token",
              "aws-access-key",
              "google-api-key",
              "stripe-live-key",
              "slack-token",
              "possible-hardcoded-secret",
              "sensitive-env-assignment",
              "database-credential",
          }
          current_blocking = [
              item for item in current if item["category"] in blocking
          ]
          if current_blocking:
              safe = [
                  {"category": item["category"], "path": item["path"], "line": item["line"]}
                  for item in current_blocking
              ]
              print("BLOCKING_CURRENT_FINDINGS_JSON="+json.dumps(safe, separators=(",",":")))
              raise SystemExit(1)
          PY
