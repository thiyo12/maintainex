name: Phase 0-7 + Phase 8 Validation

on:
  push:
    branches:
      - phase0-7-integration-fix
      - phase8-country-engine
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maintainex
          POSTGRES_PASSWORD: maintainex_ci
          POSTGRES_DB: maintainex_test_phase07_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U maintainex -d maintainex_test_phase07_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://maintainex:maintainex_ci@localhost:5432/maintainex_test_phase07_ci
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: phase07-ci-nextauth-secret-0123456789
      MARKETPLACE_JWT_SECRET: phase07-ci-marketplace-jwt-secret-01234567890123456789
      JWT_SECRET: phase07-ci-jwt-secret-01234567890123456789
      JWT_REFRESH_SECRET: phase07-ci-refresh-secret-0123456789012345
      PASSWORD_PEPPER: phase07-ci-pepper-012345678901234567890
      CRON_SECRET: phase07-ci-cron-secret-012345678901234567
      INTERNAL_SYNC_SECRET: phase07-ci-sync-secret-01234567890123456
      ALLOW_TEST_OTP: "true"
      VPS_INTEGRATION: "true"
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-password
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Bootstrap isolated DB from immutable production baseline
        run: |
          npx prisma db execute --file prisma/migrations/20260101000000_baseline/migration.sql --schema prisma/schema.prisma
          npx prisma migrate resolve --applied 20250626000000_add_name_change_cooldown
          npx prisma migrate resolve --applied 20260101000000_baseline
          npx prisma migrate resolve --applied 20260830000000_add_customer_profile_fields

      - name: Apply post-baseline migrations with production command
        run: npx prisma migrate deploy

      - name: Verify migration second run is no-op (idempotency)
        run: npx prisma migrate deploy

      - name: Verify Phase 8 migration columns exist in PostgreSQL
        run: |
          psql "$DATABASE_URL" -c "SELECT \"countryCode\" FROM \"User\" LIMIT 1;"
          psql "$DATABASE_URL" -c "SELECT \"currency\" FROM \"JobEscrow\" LIMIT 1;"
          psql "$DATABASE_URL" -c "SELECT \"currency\" FROM \"WalletBalance\" LIMIT 1;"
          psql "$DATABASE_URL" -c "SELECT \"countryCode\" FROM \"MarketplaceJob\" LIMIT 1;"

      - name: Verify Phase 8 indexes exist in PostgreSQL
        run: |
          psql "$DATABASE_URL" -c "\di *countryCode*" || true

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Phase 8 unit tests
        run: npx vitest run tests/phase8 --reporter=verbose

      - name: Phase 0-7 regression tests
        shell: bash
        run: |
          set -o pipefail
          npx vitest run tests --reporter=verbose 2>&1 | tee vitest-output.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-7-vitest-output
          path: vitest-output.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
