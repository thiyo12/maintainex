name: Phase 0-7 Validation

on:
  push:
    branches:
      - phase0-7-integration-fix
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maintainex
          POSTGRES_PASSWORD: maintainex_ci
          POSTGRES_DB: maintainex_phase07_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U maintainex -d maintainex_phase07_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://maintainex:maintainex_ci@localhost:5432/maintainex_phase07_ci
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: phase07-ci-nextauth-secret-0123456789
      JWT_SECRET: phase07-ci-jwt-secret-01234567890123456789
      JWT_REFRESH_SECRET: phase07-ci-refresh-secret-0123456789012345
      PASSWORD_PEPPER: phase07-ci-pepper-012345678901234567890
      CRON_SECRET: phase07-ci-cron-secret-012345678901234567
      INTERNAL_SYNC_SECRET: phase07-ci-sync-secret-01234567890123456
      ALLOW_TEST_OTP: "true"
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-password
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to isolated CI database
        run: npx prisma migrate deploy

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Phase 0-7 regression tests
        run: npx vitest run tests

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
