name: Phase 0-9 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/crm-job360
      - feature/crm-v2-rebuild
      - phase0-7-integration-fix
      - phase8-country-engine
      - phase9-production-readiness
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maintainex
          POSTGRES_PASSWORD: maintainex_ci
          POSTGRES_DB: maintainex_test_phase07_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U maintainex -d maintainex_test_phase07_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://maintainex:maintainex_ci@localhost:5432/maintainex_test_phase07_ci
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: phase07-ci-nextauth-secret-0123456789
      MARKETPLACE_JWT_SECRET: phase07-ci-marketplace-jwt-secret-01234567890123456789
      JWT_SECRET: phase07-ci-jwt-secret-01234567890123456789
      JWT_REFRESH_SECRET: phase07-ci-refresh-secret-0123456789012345
      PASSWORD_PEPPER: phase07-ci-pepper-012345678901234567890
      CRON_SECRET: phase07-ci-cron-secret-012345678901234567
      INTERNAL_SYNC_SECRET: phase07-ci-sync-secret-01234567890123456
      ALLOW_TEST_OTP: "true"
      VPS_INTEGRATION: "true"
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-password
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Bootstrap isolated DB from immutable production baseline
        run: |
          # Generate baseline from current schema (creates ALL 150 tables)
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/baseline.sql
          npx prisma db execute --file /tmp/baseline.sql --schema prisma/schema.prisma
          # Resolve ALL directory migrations as applied (baseline already created full schema)
          for dir in prisma/migrations/*/; do
            name=$(basename "$dir")
            npx prisma migrate resolve --applied "$name" 2>&1 | grep -E "marked|Error" || true
          done

      - name: Restore raw production invariants omitted by Prisma schema baseline
        run: |
          psql "$DATABASE_URL" <<'SQL'
          ALTER TABLE "ProviderOpportunity"
            DROP CONSTRAINT IF EXISTS "ProviderOpportunity_xor_provider";
          ALTER TABLE "ProviderOpportunity"
            ADD CONSTRAINT "ProviderOpportunity_xor_provider"
            CHECK (
              ("taskerId" IS NOT NULL AND "companyId" IS NULL)
              OR
              ("taskerId" IS NULL AND "companyId" IS NOT NULL)
            );

          CREATE UNIQUE INDEX IF NOT EXISTS "JobVerificationPin_one_active_per_job"
            ON "JobVerificationPin"("jobId")
            WHERE "status" = 'ACTIVE';

          CREATE OR REPLACE FUNCTION check_job_review_owner()
          RETURNS TRIGGER AS $review_owner$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM "MarketplaceJob"
              WHERE id = NEW."jobId" AND "customerId" = NEW."customerId"
            ) THEN
              RAISE EXCEPTION 'Customer does not own this job';
            END IF;
            RETURN NEW;
          END;
          $review_owner$ LANGUAGE plpgsql;

          DROP TRIGGER IF EXISTS trg_job_review_owner_check ON "JobReview";
          CREATE TRIGGER trg_job_review_owner_check
            BEFORE INSERT ON "JobReview"
            FOR EACH ROW EXECUTE FUNCTION check_job_review_owner();

          CREATE UNIQUE INDEX IF NOT EXISTS "CompanyJobAssignment_active_per_job_idx"
            ON "CompanyJobAssignment"("jobId")
            WHERE "status" IN ('ASSIGNED', 'ACCEPTED', 'IN_PROGRESS');

          CREATE UNIQUE INDEX IF NOT EXISTS "JobQuote_one_pending_per_provider_job"
            ON "JobQuote"("jobId", "providerId")
            WHERE status = 'PENDING';

          CREATE UNIQUE INDEX IF NOT EXISTS "PaymentIntent_one_active_per_job"
            ON "PaymentIntent"("jobId")
            WHERE status IN ('CREATED', 'PENDING');
          SQL

      - name: Verify migration deploy is no-op
        run: npx prisma migrate deploy

      - name: Verify Phase 8 migration columns exist in PostgreSQL
        run: |
          psql "$DATABASE_URL" -c "SELECT \"countryCode\" FROM \"User\" LIMIT 1;"
          psql "$DATABASE_URL" -c "SELECT \"currency\" FROM \"JobEscrow\" LIMIT 1;"
          psql "$DATABASE_URL" -c "SELECT \"currency\" FROM \"WalletBalance\" LIMIT 1;"
          psql "$DATABASE_URL" -c "SELECT \"countryCode\" FROM \"MarketplaceJob\" LIMIT 1;"

      - name: Verify Phase 8 indexes exist in PostgreSQL
        run: |
          psql "$DATABASE_URL" -c "\di *countryCode*"

      - name: TypeScript
        run: npx tsc --noEmit 2>&1 | tee /tmp/tsc.txt

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: /tmp/tsc.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Mobile TypeScript
        run: |
          cd apps/mobile
          npx tsc --noEmit

      - name: Schema integrity tests
        run: npx vitest run tests/structural/schema-integrity.test.ts tests/structural/migration-validation.test.ts tests/structural/crm-legacy-role-retirement.test.ts tests/structural/crm-app-web-v2.test.ts tests/structural/crm-legacy-customer-api-retirement.test.ts tests/structural/crm-v2-shell-permissions.test.ts tests/structural/crm-v2-visual-contract.test.ts tests/structural/crm-v2-migrated-page-contract.test.ts tests/structural/crm-v2-shell.test.ts --reporter=verbose 2>&1 | tee /tmp/schema-tests.txt
        if: always()

      - name: Upload schema test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-test-diagnostics
          path: /tmp/schema-tests.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Migration preservation tests
        run: npx vitest run tests/structural/migration-preservation.test.ts --reporter=verbose 2>&1 | tee /tmp/migration-tests.txt
        if: always()

      - name: Upload migration test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-diagnostics
          path: /tmp/migration-tests.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Country engine invariant tests
        run: npx vitest run tests/finance/country-engine-invariants.test.ts tests/security/matching-isolation.test.ts tests/rbac/admin-country-rbac.test.ts tests/security/quote-country-eligibility.test.ts --reporter=verbose 2>&1 | tee /tmp/invariant-tests.txt
        if: always()

      - name: Upload invariant test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-test-diagnostics
          path: /tmp/invariant-tests.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Negative security tests (Part W)
        run: npx vitest run tests/security/negative-security.test.ts --reporter=verbose 2>&1 | tee /tmp/security-tests.txt
        if: always()

      - name: Phase 9 security tests
        run: npx vitest run tests/security/phase11-offer-redemption.test.ts tests/security/crm-subscriptions-v2.test.ts tests/security/real-estate-public-privacy.test.ts tests/security/crm-three-layer-security.test.ts tests/security/crm-market-config-v2.test.ts tests/security/crm-catalog-v2.test.ts tests/security/crm-promotions-v2.test.ts tests/security/crm-settings-registry-v2.test.ts tests/security/crm-profession-taxonomy-v2.test.ts tests/security/crm-locations-v2.test.ts tests/security/mobile-taxonomy-source-v2.test.ts tests/security/crm-governance-policy.test.ts tests/security/crm-refund-approval-boundary.test.ts tests/security/crm-payment-escrow-control-boundary.test.ts tests/security/crm-financial-ledger-boundary.test.ts tests/security/crm-commission-control-boundary.test.ts tests/security/crm-approval-engine.test.ts tests/security/crm-approval-service.test.ts tests/security/crm-step-up-proof.test.ts tests/security/crm-permission-overrides.test.ts tests/security/crm-permission-catalog.test.ts tests/security/crm-staff-session-invalidation.test.ts tests/security/crm-staff-role-session-hardening.test.ts tests/security/crm-staff-step-up-enforcement.test.ts tests/security/crm-global-search-scope.test.ts tests/security/admin-staff-password-hashing.test.ts tests/security/admin-login-identity-boundary.test.ts tests/security/admin-session-token-lifecycle.test.ts tests/security/admin-totp-verification.test.ts tests/security/crm-kyc-privacy-boundary.test.ts tests/security/marketplace-lifecycle-bypass-regression.test.ts tests/security/legacy-marketplace-route-security.test.ts tests/security/payment-public-origin.test.ts --reporter=verbose 2>&1 | tee /tmp/phase9-security-tests.txt
        if: always()

      - name: Upload Phase 9 security test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-security-test-diagnostics
          path: /tmp/phase9-security-tests.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload security test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-diagnostics
          path: /tmp/security-tests.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Current financial lifecycle gates
        run: >-
          npx vitest run
          tests/finance/payments/cash-payment-lifecycle.test.ts
          tests/finance/payments/payment-work-start-lifecycle.test.ts
          tests/finance/payments/cancellation-payment-postgres.test.ts
          tests/finance/payments/payment-intent-concurrency-postgres.test.ts
          tests/finance/payments/payhere-refund-concurrency-contract.test.ts
          tests/finance/payouts/payout-engine.test.ts
          tests/finance/commission-currency-isolation.test.ts tests/finance/commission-governance.test.ts tests/finance/commission-settlement-actions.test.ts tests/finance/settlement-history-v2.test.ts
          tests/quotes/change-order.test.ts
          --reporter=verbose 2>&1 | tee /tmp/financial-flow-tests.txt
        if: always()

      - name: Upload financial flow test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-flow-test-diagnostics
          path: /tmp/financial-flow-tests.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Historical full regression baseline (non-blocking)
        continue-on-error: true
        run: npx vitest run tests --reporter=verbose 2>&1 | tee /tmp/regression-tests.txt
        if: always()

      - name: Upload regression test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-diagnostics
          path: /tmp/regression-tests.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build 2>&1 | tee /tmp/build-output.txt
        if: always()

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: /tmp/build-output.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Docker build
        run: |
          docker build \
            -t maintainex:phase9-ci-${GITHUB_SHA} \
            .
        if: always()

      - name: Docker container start
        run: |
          docker run -d \
            --name phase9-ci-test \
            --add-host=host.docker.internal:host-gateway \
            -p 3199:3000 \
            -e DATABASE_URL="postgresql://maintainex:maintainex_ci@host.docker.internal:5432/maintainex_test_phase07_ci" \
            -e NEXTAUTH_URL="http://localhost:3199" \
            -e NEXTAUTH_SECRET="phase07-ci-nextauth-secret-0123456789" \
            -e MARKETPLACE_JWT_SECRET="phase07-ci-marketplace-jwt-secret-01234567890123456789" \
            -e JWT_SECRET="phase07-ci-jwt-secret-01234567890123456789" \
            -e JWT_REFRESH_SECRET="phase07-ci-refresh-secret-0123456789012345" \
            -e PASSWORD_PEPPER="phase07-ci-pepper-012345678901234567890" \
            -e CRON_SECRET="phase07-ci-cron-secret-012345678901234567" \
            -e INTERNAL_SYNC_SECRET="phase07-ci-sync-secret-01234567890123456" \
            -e ALLOW_TEST_OTP="true" \
            -e CLOUDINARY_CLOUD_NAME="test" \
            -e CLOUDINARY_API_KEY="test" \
            -e CLOUDINARY_API_SECRET="test" \
            -e NODE_ENV="production" \
            maintainex:phase9-ci-${GITHUB_SHA}
          echo "Waiting 10s for container startup (prisma migrate deploy + next start)..."
          sleep 10
          RUNNING=$(docker inspect -f '{{.State.Running}}' phase9-ci-test 2>/dev/null || echo "false")
          echo "Container running: $RUNNING"
          if [ "$RUNNING" != "true" ]; then
            echo "FAIL: Container exited during startup"
            docker logs phase9-ci-test 2>&1 || true
            exit 1
          fi
          echo "Container is alive. Startup logs:"
          docker logs phase9-ci-test 2>&1 | tail -20 || true
        if: always()

      - name: Docker health check
        run: |
          echo "Waiting for Next.js to finish booting after prisma migrate..."
          for i in 1 2 3 4 5 6 7 8; do
            RUNNING=$(docker inspect -f '{{.State.Running}}' phase9-ci-test 2>/dev/null || echo "false")
            if [ "$RUNNING" != "true" ]; then
              echo "FAIL: Container died during startup"
              docker logs phase9-ci-test 2>&1 | tail -40 || true
              exit 1
            fi
            HTTP_CODE=$(curl -s -o /tmp/health-response.json -w "%{http_code}" http://localhost:3199/api/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check PASSED (HTTP $HTTP_CODE)"
              cat /tmp/health-response.json
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying in 5s..."
            sleep 5
          done
          echo "Health check FAILED after 8 attempts"
          docker logs phase9-ci-test 2>&1 | tail -50 || true
          exit 1
        if: always()

      - name: Verify non-root user
        run: |
          RUNNING=$(docker inspect -f '{{.State.Running}}' phase9-ci-test 2>/dev/null || echo "false")
          if [ "$RUNNING" != "true" ]; then
            echo "FAIL: Container is not running, cannot check UID"
            docker logs phase9-ci-test 2>&1 | tail -20 || true
            exit 1
          fi
          UID_VALUE=$(docker exec phase9-ci-test id -u 2>&1)
          if [ $? -ne 0 ]; then
            echo "FAIL: docker exec id -u failed: $UID_VALUE"
            exit 1
          fi
          echo "Container UID: $UID_VALUE"
          if [ "$UID_VALUE" = "0" ]; then
            echo "FAIL: Container is running as root (UID 0)"
            exit 1
          fi
          echo "PASS: Container running as non-root (UID $UID_VALUE)"
        if: always()

      - name: Docker cleanup
        if: always()
        run: |
          docker stop phase9-ci-test 2>/dev/null || true
          docker rm phase9-ci-test 2>/dev/null || true
          docker rmi maintainex:phase9-ci-${GITHUB_SHA} 2>/dev/null || true
